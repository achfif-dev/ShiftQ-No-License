name: Auto-cleanup Keystore Artifacts

# TEMUAN KEAMANAN (audit ulang, lihat catatan di generate_keystore.yml): artifact yang dihasilkan
# workflow itu (release-keystore-BACKUP-INI, keystore-info) berisi kunci signing release APK +
# passwordnya secara PLAIN -- siapa pun dengan akses baca ke repo ini bisa mendownloadnya selama
# artifact masih ada. generate_keystore.yml sudah menurunkan retention-days ke 1 hari sebagai
# lapisan pertama, tapi itu tetap mengandalkan "kamu ingat hapus run-nya manual". Workflow ini
# jadi lapisan kedua yang OTOMATIS: berjalan tiap 15 menit, cari artifact dari run
# generate_keystore.yml yang sudah berumur lebih dari CUTOFF_MINUTES, lalu hapus lewat GitHub API
# -- supaya jendela paparan dibatasi otomatis (bukan cuma kalau kamu ingat), sekaligus tetap
# memberi waktu wajar untuk sekali download setelah generate_keystore.yml selesai.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CUTOFF_MINUTES: 30
    steps:
      - name: Hapus artifact keystore yang sudah kedaluwarsa
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          NOW_EPOCH=$(date -u +%s)
          CUTOFF_EPOCH=$((NOW_EPOCH - CUTOFF_MINUTES * 60))

          echo "Mencari artifact rahasia keystore yang lebih tua dari $CUTOFF_MINUTES menit..."

          # Ambil semua artifact repo (paginasi 100/halaman), filter nama yang relevan dengan
          # generate_keystore.yml saja (bukan artifact workflow lain seperti app-debug-apk) supaya
          # tidak pernah menyentuh artifact build biasa.
          PAGE=1
          FOUND_ANY=0
          while :; do
            RESPONSE=$(gh api "repos/$REPO/actions/artifacts?per_page=100&page=$PAGE")
            COUNT=$(echo "$RESPONSE" | jq '.artifacts | length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            echo "$RESPONSE" | jq -c '.artifacts[] | select(.name == "release-keystore-BACKUP-INI" or .name == "keystore-info")' | while read -r artifact; do
              ID=$(echo "$artifact" | jq -r '.id')
              NAME=$(echo "$artifact" | jq -r '.name')
              CREATED_AT=$(echo "$artifact" | jq -r '.created_at')
              EXPIRED=$(echo "$artifact" | jq -r '.expired')
              CREATED_EPOCH=$(date -u -d "$CREATED_AT" +%s)

              if [ "$EXPIRED" = "true" ]; then
                continue
              fi

              if [ "$CREATED_EPOCH" -lt "$CUTOFF_EPOCH" ]; then
                echo "Menghapus artifact #$ID ($NAME, dibuat $CREATED_AT)..."
                gh api -X DELETE "repos/$REPO/actions/artifacts/$ID"
              else
                AGE_MIN=$(( (NOW_EPOCH - CREATED_EPOCH) / 60 ))
                echo "Lewati artifact #$ID ($NAME) -- baru berumur ${AGE_MIN} menit, belum lewat cutoff."
              fi
            done

            PAGE=$((PAGE + 1))
          done

          echo "Selesai."
