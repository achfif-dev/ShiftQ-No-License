name: Generate Release Keystore (jalankan SEKALI saja)
on:
  workflow_dispatch: {}

# Workflow SEKALI PAKAI: membuat keystore signing release secara otomatis di runner GitHub
# (karena kamu tidak punya Termux/terminal untuk jalankan keytool sendiri). Hasilnya berupa
# 2 file yang bisa didownload dari halaman run ini (Artifacts):
#   - release-keystore.jks   -> file keystore asli, SIMPAN baik-baik (backup ke Drive dll),
#                               ini kunci tanda tangan app kamu selamanya.
#   - keystore-info.txt      -> isi 4 nilai yang perlu kamu copy ke GitHub Secrets.
#
# TEMUAN KEAMANAN (audit ulang): kedua file di atas WAJIB dianggap rahasia penuh -- siapa pun
# dengan akses baca ke repo ini (atau siapa saja kalau repo publik) bisa mendownloadnya selama
# artifact belum hilang, dan kalau bocor, penyerang bisa menandatangani APK jahat yang akan
# DITERIMA Android sebagai "update sah" dari app yang sama (Android cuma mengecek kecocokan
# signature, bukan siapa penerbitnya) -- jauh lebih berbahaya dari kebocoran source code biasa,
# apalagi sekarang app ini TIDAK PAKAI sistem lisensi (lihat README) sehingga beredar bebas
# sebagai APK. Sebelumnya kedua isi rahasia ini juga ditulis dobel ke $GITHUB_STEP_SUMMARY
# (halaman ringkasan run yang langsung tampil di browser TANPA perlu download apa pun, retensinya
# ikut retensi run -- jauh lebih lama dari retention-days artifact) -- sudah DIHAPUS, summary di
# bawah sekarang cuma instruksi, isi rahasia HANYA ada di artifact yang wajib didownload dulu.
# retention-days juga diturunkan dari 7 ke 1 hari, DAN workflow terpisah
# `cleanup_keystore_artifacts.yml` otomatis menghapus artifact-artifact run ini begitu berumur
# lebih dari 30 menit -- jadi walau kamu lupa hapus run ini secara manual, jendela paparannya
# tetap dibatasi otomatis (bukan cuma mengandalkan ingatan seperti sebelumnya).
#
# SETELAH kamu copy semua ke Secrets, tetap disarankan hapus run ini manual (Actions > run ini >
# "..." > Delete) supaya tidak menunggu 30 menit auto-cleanup di atas.
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17 (untuk keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore + password acak
        run: |
          # PENTING: keytool modern (JDK 17+) membuat keystore format PKCS12 secara
          # default. Berbeda dari format JKS lama, PKCS12 TIDAK punya password terpisah
          # untuk private key -- hanya ada SATU password sungguhan (password keystore).
          # Karena itu di sini storepass dan keypass sengaja dibuat SAMA PERSIS. Kalau
          # dibuat beda, private key tidak akan bisa dibuka lagi walau storepass benar.
          STORE_PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 20)
          KEY_PASS="$STORE_PASS"
          ALIAS="posapp"

          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=POS App, OU=Dev, O=YAPIDA, L=Jakarta, S=Jakarta, C=ID"

          base64 -w 0 release-keystore.jks > keystore.b64

          {
            echo "=== SALIN 4 NILAI DI BAWAH INI KE GITHUB SECRETS ==="
            echo "CATATAN: RELEASE_KEYSTORE_PASSWORD dan RELEASE_KEY_PASSWORD SENGAJA sama"
            echo "persis (format PKCS12 tidak punya password key terpisah)."
            echo "PENTING: setiap value ada di baris tersendiri, di antara pembatas >>> dan <<<."
            echo "Copy PERSIS teks di antara pembatas itu saja (jangan ikut pembatasnya,"
            echo "jangan ikut baris kosong sebelum/sesudahnya)."
            echo ""
            echo "Secret name: RELEASE_KEYSTORE_BASE64"
            echo ">>>"
            cat keystore.b64
            echo ""
            echo "<<<"
            echo ""
            echo "Secret name: RELEASE_KEYSTORE_PASSWORD"
            echo ">>>"
            echo "$STORE_PASS"
            echo "<<<"
            echo ""
            echo "Secret name: RELEASE_KEY_ALIAS"
            echo ">>>"
            echo "$ALIAS"
            echo "<<<"
            echo ""
            echo "Secret name: RELEASE_KEY_PASSWORD"
            echo ">>>"
            echo "$KEY_PASS"
            echo "<<<"
            echo ""
            echo "=== SETELAH DI-COPY SEMUA, HAPUS RUN INI DARI TAB ACTIONS ==="
          } > keystore-info.txt

          # CATATAN KEAMANAN: TIDAK menulis nilai rahasia (base64 keystore, password) ke
          # $GITHUB_STEP_SUMMARY -- halaman summary tampil langsung di browser tanpa perlu
          # download, jadi kalau rahasia ditaruh di sana paparannya jauh lebih luas daripada
          # sekadar file artifact. Isi rahasia HANYA ada di artifact "keystore-info" di bawah
          # (WAJIB didownload dulu, dan otomatis terhapus oleh cleanup_keystore_artifacts.yml
          # setelah 30 menit -- lihat catatan di atas file ini).
          {
            echo "## Keystore & password SUDAH dibuat -- lihat tab Artifacts di run ini"
            echo ""
            echo "Isi rahasianya (base64 keystore + 4 nilai untuk GitHub Secrets) SENGAJA"
            echo "TIDAK ditampilkan di halaman ini -- scroll ke bawah/atas halaman run ini,"
            echo "buka bagian **Artifacts**, lalu download 2 file berikut:"
            echo ""
            echo "- \`release-keystore-BACKUP-INI\` -> file keystore asli, backup baik-baik."
            echo "- \`keystore-info\` -> \`keystore-info.txt\` isi 4 nilai untuk disalin ke"
            echo "  Settings > Secrets and variables > Actions."
            echo ""
            echo "**Kedua artifact di atas otomatis terhapus ~30 menit dari sekarang** (lihat"
            echo "\`cleanup_keystore_artifacts.yml\`) -- segera download sebelum itu. Setelah"
            echo "semua tersimpan di Secrets, disarankan hapus run ini juga secara manual"
            echo "(\"...\" > Delete workflow run) alih-alih menunggu auto-cleanup."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore file (backup asli - simpan baik-baik)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-BACKUP-INI
          path: release-keystore.jks
          retention-days: 1

      - name: Upload info (isi untuk GitHub Secrets)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-info
          path: keystore-info.txt
          retention-days: 1
