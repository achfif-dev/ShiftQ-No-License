name: Deploy Cloud Functions & Firestore Rules

# Deploy `functions/index.js` (mintSyncToken untuk Sinkronisasi Cloud, saveGatewayCredentials/
# createQrisCharge/midtransNotification untuk QRIS Otomatis) dan `firestore.rules` ke proyek
# Firebase kamu — sepenuhnya lewat browser di tab Actions, tanpa perlu Node/firebase-tools/
# terminal di komputer sendiri. Lihat FIREBASE_SETUP.md langkah 5 untuk panduan lengkap.
#
# WAJIB diisi dulu di Settings > Secrets and variables > Actions sebelum menjalankan ini:
#   - FIREBASE_SERVICE_ACCOUNT_JSON: isi lengkap file JSON service account (Firebase Console >
#     Project Settings > Service Accounts > Generate new private key), role minimal "Firebase Admin".
#   - FIREBASE_PROJECT_ID: Project ID Firebase (bukan nama tampilan) — SAMA dengan yang dipakai
#     di PAYMENT_GATEWAY_SETUP.md, tidak perlu dibuat ulang kalau sudah ada.
on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    paths:
      - "functions/**"
      - "firestore.rules"
      - ".github/workflows/deploy_firebase.yml"

jobs:
  deploy:
    name: Deploy functions + firestore.rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cek secrets sudah diisi
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ] || [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_JSON dan/atau FIREBASE_PROJECT_ID belum diisi — lihat FIREBASE_SETUP.md langkah 5."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependency functions
        working-directory: functions
        run: npm install --omit=dev

      - name: Tulis kredensial service account ke file sementara
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy ke Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx firebase-tools deploy \
            --only functions,firestore:rules \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive

      - name: Hapus file kredensial sementara
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
