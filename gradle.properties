org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# R8 "full mode" (default sejak AGP 8.x) diketahui punya bug pada beberapa versi Jetpack
# Compose: bisa menyebabkan ExceptionInInitializerError/NullPointerException di static
# initializer internal Compose saat ComposeView pertama kali attach ke window (crash langsung
# begitu app dibuka, HANYA di build release/minified). Mode "compat" di bawah ini jauh lebih
# aman untuk app berbasis Compose karena optimisasi R8-nya tidak seagresif full mode.
android.enableR8.fullMode=false

# v: migrasi API 36/AGP 9.0 -- error CI "Android BaseExtension not found" saat menerapkan
# plugin com.google.dagger.hilt.android. AGP 9.0 SECARA DEFAULT hanya menyediakan DSL/API
# BARU (BaseExtension & tipe lama lainnya DIHAPUS sepenuhnya) -- plugin Hilt (bahkan versi
# terbaru 2.57.2) ternyata masih mencari BaseExtension yang lama di balik layar, jadi gagal
# diterapkan. android.newDsl=false ini flag transisi RESMI dari Google yang mengembalikan
# ketersediaan tipe DSL lama untuk plugin pihak ketiga yang belum sepenuhnya migrasi (dengan
# peringatan deprecation, bukan error) -- TIDAK mengurangi dukungan compileSdk=36 sama sekali,
# cuma soal API/tipe internal mana yang tersedia untuk plugin Gradle. CATATAN: flag ini akan
# DIHAPUS TOTAL di AGP 10.0 (pertengahan 2026) -- kalau nanti upgrade ke AGP 10, cek dulu apakah
# Hilt sudah merilis versi yang benar-benar kompatibel DSL baru sebelum menghapus baris ini.
android.newDsl=false

# Jaring pengaman TAMBAHAN utk error "Using kotlin.sourceSets DSL ... not allowed with
# built-in Kotlin" -- naik ke KSP 2.3.9 (lihat root build.gradle.kts) SEHARUSNYA sudah cukup
# (dukungan built-in Kotlin resmi ditambahkan KSP sejak 2.3.1), tapi baris ini didokumentasikan
# resmi oleh Google sebagai flag suppress khusus error ini kalau masih ada plugin ksp/lain yang
# belum sepenuhnya migrasi -- aman dihapus kalau setelah upgrade KSP terbukti tidak lagi perlu.
android.disallowKotlinSourceSets=false